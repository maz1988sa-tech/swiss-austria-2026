<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al Ramsat — منصة استقطاب المواهب</title>
<meta name="description" content="لوحة تنفيذية لتحليل قاعدة المرشحين — تعمل بالكامل داخل المتصفح">
<link rel="icon" type="image/png" href="data:image/png;base64,/*__FAVB64__*/">
<style>/*__FONTS__*/</style>
<style>/*__CSS__*/</style>
</head>
<body class="loading">

<div id="splash">
  <img class="sm" id="splashLogo" alt="Al Ramsat">
  <div class="spin"></div>
  <div class="st">جارٍ تجهيز البيانات…</div>
</div>

<div class="shell">
<header class="topbar">
  <div class="r1">
    <div class="brandid">
      <img class="logo" id="hdrLogo" alt="Al Ramsat">
      <span class="bdiv"></span>
      <div class="brand"><span class="org" id="bOrg"></span><span class="ttl" id="bTtl"></span></div>
    </div>
    <nav class="tabs">
      <button class="tab on"></button><button class="tab"></button><button class="tab"></button><button class="tab"></button><button class="tab"></button>
    </nav>
    <div class="utils">
      <button class="ic pri" id="syncBtn" title="تحديث البيانات من Google Sheet" aria-label="Refresh"></button>
      <button class="ic" id="saveBtn" title="حفظ مساحة العمل" aria-label="Save"><span class="dot" id="saveDot"></span></button>
      <button class="ic" id="themeBtn" title="الوضع الليلي · Dark mode" aria-label="Theme"></button>
      <button class="ic" id="langBtn" title="العربية / English" aria-label="Language"></button>
      <button class="ic" id="updBtn" title="مصدر البيانات · Data source" aria-label="Data source"></button>
      <span class="cloud" id="cloudPill" hidden><i></i><span id="cloudTxt"></span></span>
      <div class="asof"><span id="asofL"></span><b id="asofD"></b></div>
    </div>
  </div>
  <nav class="qrow" id="qnav"></nav>
  <div class="frow">
    <div class="flt srch"><label id="lSearch"></label><input id="fQ" autocomplete="off" type="search"></div>
    <div class="flt"><label id="lPos"></label><select id="fPos"></select></div>
    <div class="flt"><label id="lNat"></label><select id="fNat"></select></div>
    <div class="flt"><label id="lExp"></label><select id="fExp"></select></div>
    <div class="flt"><label id="lRes"></label><select id="fRes"></select></div>
    <div class="flt"><label id="lSal"></label><select id="fSal"></select></div>
    <div class="flt"><label id="lSt"></label><select id="fSt"></select></div>
    <div class="flt"><label id="lPer"></label><select id="fPer"></select></div>
    <span class="mcount" id="mcount"></span>
    <button class="rst" id="rstBtn"></button>
  </div>
</header>

<div class="emptybar" id="emptyBar" hidden>
  <span class="eb-ic" id="ebIc"></span>
  <span class="eb-txt"><b id="ebT"></b><span id="ebS"></span></span>
  <button class="btn pri" id="ebBtn"></button>
</div>

<div class="emptybar cloudbar" id="cloudBar" hidden>
  <span class="eb-ic" id="cbIc"></span>
  <span class="eb-txt"><b id="cbT"></b><span id="cbS"></span></span>
  <button class="btn pri" id="cbBtn"></button>
  <button class="btn" id="cbX" style="flex:0 0 auto;padding:0 14px;height:38px"></button>
</div>

<main class="main">

  <section class="sec on">
    <div class="sechead"><span class="kick">00</span><span class="stitle" id="secT0"></span><span class="sdesc" id="secD0"></span></div>
    <div class="kpis" id="kpi0"></div>
    <div class="grid2"><div class="card" id="flowCard"></div><div class="card" id="funCard"></div></div>
    <div class="grid2"><div class="card" id="topCard"></div><div class="card" id="dqCard"></div></div>
  </section>

  <section class="sec">
    <div class="sechead"><span class="kick">01</span><span class="stitle" id="secT1"></span><span class="sdesc" id="secD1"></span></div>
    <div class="kpis c4" id="kpi1"></div>
    <div class="card" style="margin-top:14px" id="roleTbl"></div>
    <div class="grid22"><div class="card" id="saCard"></div><div class="card" id="certCard"></div></div>
  </section>

  <section class="sec">
    <div class="sechead"><span class="kick">02</span><span class="stitle" id="secT2"></span><span class="sdesc" id="secD2"></span></div>
    <div class="kpis c5" id="kpi2"></div>
    <div class="grid3"><div class="card" id="natCard"></div><div class="card" id="ageCard"></div><div class="card" id="expCard"></div></div>
    <div class="grid22"><div class="card" id="eduCard"></div><div class="card" id="geoCard"></div></div>
  </section>

  <section class="sec">
    <div class="sechead"><span class="kick">03</span><span class="stitle" id="secT3"></span><span class="sdesc" id="secD3"></span></div>
    <div class="kpis c5" id="kpi3"></div>
    <div class="grid2"><div class="card" id="salCard"></div><div class="card" id="gapCard"></div></div>
  </section>

  <section class="sec">
    <div class="sechead"><span class="kick">04</span><span class="stitle" id="secT4"></span><span class="sdesc" id="secD4"></span></div>
    <div class="kpis c4" id="kpi4"></div>
    <div class="eng">
      <div class="card">
        <div class="ph" id="wTitle"></div>
        <div style="padding:12px 15px 0;display:flex;flex-direction:column;gap:10px">
          <div class="flt" style="width:100%"><label id="lEngRole"></label><select id="engPos" style="max-width:none;width:100%"></select></div>
          <div class="wrow"><div class="wt"><span id="lEngTh"></span><b id="engThV"></b></div><input type="range" id="engTh" min="40" max="100" step="5"></div>
        </div>
        <div class="wpanel" id="wPanel"></div>
        <div class="cap" id="wCap"></div>
      </div>
      <div class="card" id="slCard"></div>
    </div>
  </section>

</main>

<footer class="foot">
  <img class="flogo" id="footLogo" alt="Al Ramsat">
  <span class="fmain"><b>Al Ramsat</b><span id="ftSector"></span></span>
  <span class="fcontact">
    <a href="tel:+966112389996" dir="ltr">+966 11 238 9996</a>
    <span class="fdot">·</span>
    <a href="mailto:info@alramsat.com" dir="ltr">info@alramsat.com</a>
    <span class="fdot">·</span>
    <a href="https://alramsat.com" target="_blank" rel="noopener" dir="ltr">alramsat.com</a>
  </span>
  <span class="fnote" id="ftNote"></span>
  <span class="fver" id="ftVer"></span>
</footer>
</div>

<!-- modal: candidate list -->
<div class="ov" id="mOv">
  <div class="modal">
    <div class="mh"><div style="flex:1;min-width:0"><div class="mt" id="mTitle"></div><div class="ms" id="mSub"></div></div><button class="mx" id="mClose">&times;</button></div>
    <div class="mstats" id="mStats"></div>
    <div class="mfl">
      <div class="mf"><label id="mfStL"></label><select id="mfSt"></select></div>
      <div class="mf"><label id="mfNatL"></label><select id="mfNat"></select></div>
      <div class="mf"><label id="mfExpL"></label><select id="mfExp"></select></div>
      <div class="mf"><label id="mfSalL"></label><select id="mfSal"></select></div>
      <div class="mf"><label id="mSortL"></label><select id="mSort"></select></div>
      <span class="mfcount" id="mfCount"></span>
      <button class="rst sm" id="mfReset" title="مسح فلاتر النافذة"></button>
      <button class="btn sm pri" id="mExport"></button>
    </div>
    <div class="mbody" id="mBody"></div>
  </div>
</div>

<!-- drawer: candidate card -->
<div class="drwbg" id="drwBg"></div>
<aside class="drw" id="drw" aria-label="Candidate">
  <div class="dh">
    <div class="av" id="drAv"></div>
    <div style="flex:1;min-width:0"><div class="dn" id="drName"></div><div class="ds" id="drSub"></div></div>
    <button class="mx" id="drClose">&times;</button>
  </div>
  <div class="dbody" id="drBody"></div>
</aside>

<!-- upload -->
<div class="ov" id="updOv">
  <div class="upd">
    <div class="uh">
      <div class="ic pri" id="updIc" style="width:36px;height:36px"></div>
      <div style="flex:1"><div class="mt" id="updT"></div><div class="ms" id="updS"></div></div>
      <button class="mx" id="updClose">&times;</button>
    </div>
    <div class="ub">
      <div class="srcbox">
        <label class="srcl" id="lSheet"></label>
        <div class="srcrow">
          <input id="sheetUrl" type="url" dir="ltr" spellcheck="false" autocomplete="off">
          <button class="btn pri" id="syncNow"></button>
        </div>
        <div class="srchint" id="sheetHint"></div>
      </div>
      <div id="updSteps"></div>
      <details class="fallback" id="fallback">
        <summary id="fbTitle"></summary>
        <div class="drop" id="drop">
          <div class="di" id="dropIc"></div>
          <div class="dt2" id="dropT"></div>
          <div class="dd" id="dropD"></div>
        </div>
      </details>
    </div>
    <div class="uf">
      <button class="btn pri" id="updOk" style="flex:0 0 auto;padding:0 20px"></button>
      <button class="btn" id="updCancel" style="flex:0 0 auto;padding:0 18px"></button>
      <button class="btn sm" id="bkExport" style="align-self:center"></button>
      <button class="btn sm danger" id="clearBtn" style="align-self:center"></button>
      <div class="ufn" id="updNote"></div>
    </div>
  </div>
</div>

<input type="file" id="fileIn" accept=".xlsx,.xlsm" hidden>
<button id="toTop" title="أعلى" aria-label="Top"></button>
<div class="toast" id="toast"></div>

<script>/*__XLSX__*/</script>
<script>/*__ETL__*/</script>
<script>/*__GSHEET__*/</script>
<script>/*__SUPABASE__*/</script>

window.__LOGO__={l:"/*__LOGOL__*/",d:"/*__LOGOD__*/"};window.__SHEET__="/*__SHEETURL__*/";</script>
<script>/*__APP__*/</script>
</body>
</html>
